
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css?##VERSION##" />
    <link rel="stylesheet" href="css/log.css?##VERSION##" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="scripts/common.js?##VERSION##" defer></script>
    <script src="scripts/logmessages.js?##VERSION##" defer></script>
    <script src="scripts/logparsing.js?##VERSION##" defer></script>
    <title>SwiGO Super Smart</title>
    <style>
      /* Override default table borders - v9 style bottom-border only */
      .log-content table { width: 100%; border-collapse: collapse; border: none; }
      .log-content table td,
      .log-content table th { border: none; border-bottom: 1px solid rgba(0, 0, 0, 0.08); padding: 10px 4px; vertical-align: baseline; font-size: 0.85rem; }
      .log-content table tr:last-child td { border-bottom: none; }
      .log-content table td:first-child { white-space: nowrap; width: 120px; }
      .log-content table td:last-child { color: #333; }

      /* Page background and section styling */
      body { background: #f5f5f5; max-width: 40rem; margin: 0 auto; width: 100% !important; }
      header.nav-bar { width: 100% !important; max-width: 40rem !important; left: 50% !important; transform: translateX(-50%) !important; box-sizing: border-box; }
      .log-full.padding-outer {
        background: #FAFAFA;
        border: 1px solid rgba(0, 66, 37, 0.18);
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.09);
        padding: 14px 16px;
      }
      .log-header h3 { font-size: 15px; font-weight: 700; color: #333; }

      /* Filter area styling */
      .filter-header { background: transparent; border-radius: 6px; padding: 6px 0; }
      .filter-date-range { font-size: 13px; color: #555; }
      .filter-count { font-size: 12px; color: #888; }

      .date-filter-container.expanded { background: #fff !important; border-color: rgba(0, 66, 37, 0.12) !important; border-radius: 8px !important; }
      .date-input-group label { font-size: 13px; color: #555; }
      .date-input-group input,
      .date-input-group select { font-size: 13px; border-radius: 6px; border: 1px solid #ddd; }

      /* Pagination */
      .pagination-container { margin: 10px 0; }
      .pagination-container button { border-radius: 6px; font-size: 13px; }
      #pageInfo, #bottomPageInfo { font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="main-container">
      <header class="nav-bar" >
        <div>
          <a href="/" style="float:left;">
            <img src="images/logo.png" class="logo" />
          </a>
        </div>
        <br clear="all" />
        <hr style="margin: 5px 0px; border-top: 1px solid #ccc;" />
    
        <a href="/" class="switch-name-link" style="float:left;">
          <h2 class="wpg-heading" style="display: block; margin-bottom: 10px;" id="switchNameText">SuperSmart</h2>
        </a>
      </header>
    
      <div class="page" style="margin-top:6.5rem;">
        <main id="content">
          <div class="home-container gap-flex content-div active"  id="menu-1">
            
              <div class="log-full padding-outer">
                <div class="log-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                  <h3 style="margin: 0;">Operation Logs</h3>
                  <button onclick="refreshLogs()" style="background: none; border: none; cursor: pointer;">
                    <img src="images/reload.png" alt="Refresh" />
                  </button>
                </div>
                
                <!-- Filter Header -->
                <div class="filter-header">
                  <div class="filter-info">
                    <div class="filter-date-range" id="filterDateRange">All logs</div>
                    <div class="filter-count" id="filterCount">Total logs: 0</div>
                  </div>
                  <!-- <button class="filter-toggle" onclick="toggleFilter()" id="filterToggle">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
                    </svg>
                  </button> -->
                   <button class="accordion-button" onclick="toggleFilter()" id="filterToggle" style="height: 20px; padding: 0; border: none; background: none;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
                  </button>
                </div>
                
                <!-- Date Filter Controls -->
                <div class="date-filter-container" id="dateFilterContainer">
                  <div class="date-filter-row">
                    <div class="date-input-group">
                      <label for="startDate">Start Date:</label>
                      <input type="date" id="startDate" onchange="validateDates()">
                    </div>
                    <div class="date-input-group">
                      <label for="endDate">End Date:</label>
                      <input type="date" id="endDate" onchange="validateDates()">
                    </div>
                    <div class="date-input-group">
                      <label for="logLimit">Logs per page:</label>
                      <select id="logLimit">
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="200">200</option>
                        <option value="500">500</option>
                        <option value="1000">1000</option>
                      </select>
                    </div>
                    <div class="date-input-group">
                      <button onclick="applyDateFilter()">Apply Filter</button>
                    </div>
                    <div class="date-input-group">
                      <button onclick="clearDateFilter()">Clear Filter</button>
                    </div>
                  </div>
                </div>
                
                <!-- Pagination Controls -->
                <div class="pagination-container" id="paginationContainer" style="display: none;">
                  <button onclick="goToPreviousPage()" id="prevPageBtn">‹</button>
                  <span id="pageInfo">Page 1 of 1</span>
                  <button onclick="goToNextPage()" id="nextPageBtn">›</button>
                </div>
                
                <div id="loading-indicator" style="display: none; text-align: center; padding: 20px;">
                  <p>Loading logs...</p>
                </div>
                <div class="log-content cn"></div>

                <!-- Bottom Pagination Controls -->
                <div class="pagination-container bottom-pagination" id="bottomPaginationContainer" style="display: none; margin-top: 20px;">
                  <button onclick="goToPreviousPage()" id="bottomPrevPageBtn">‹</button>
                  <span id="bottomPageInfo">Page 1 of 1</span>
                  <button onclick="goToNextPage()" id="bottomNextPageBtn">›</button>
                </div>
              </div>
              </div>
            </div>
          </div>
        </main>
        <script>
                // Global variables for available dates
                let minDate = null;
                let maxDate = null;
                
                document.addEventListener("DOMContentLoaded", () => {
                  fetchWT("/dn.htm").then((response) => {
                    const v = response.headers.get("switchName");
                    if (v) {
                      const e = _qs("#switchNameText");
                      if (e) {
                        e.innerText = v;
                        document.title = v + " - SwiGO SuperSmart";
                      }
                    }
                  });
                  
                  // Initialize date pickers with default values (last 7 days)
                  const today = new Date();
                  const lastWeek = new Date(today.getTime() - (7 * 24 * 60 * 60 * 1000));
                  
                  const iSD = el('startDate');
                  const iED = el('endDate');
                  
                  if (iSD && iED) {
                    iSD.value = lastWeek.toISOString().split('T')[0];
                    iED.value = today.toISOString().split('T')[0];
                  }
                  filterLogsByDate(iSD.value, iED.value);
                });

                function alterlog(contentId) {
                  // Remove active class from all tabs and contents
                  _qsa('.tab').forEach(tab => tab.classList.remove('active'));
                  _qsa('.tab-content').forEach(content => content.classList.remove('active'));

                  // Add active class to clicked tab and its content
                  _qs(`.tab[onclick="alterlog('${contentId}')"]`).classList.add('active');
                  el(contentId).classList.add('active');

                  
                }
                
                // Extract available dates from energy records
                function extractAvailableDates() {
                    if (!allLogRecords || allLogRecords.length === 0) {
                        return;
                    }
                    
                    minDate = null;
                    maxDate = null;
                    
                    allLogRecords.forEach(log => {
                        const logDate = new Date(log.date);
                        const dateString = logDate.toISOString().split('T')[0];
                        
                        if (!minDate || logDate < minDate) {
                            minDate = new Date(logDate);
                        }
                        if (!maxDate || logDate > maxDate) {
                            maxDate = new Date(logDate);
                        }
                    });
                    
                    // Update date input constraints
                    updateDateInputConstraints();
                }
                
                // Update date input min/max attributes
                function updateDateInputConstraints() {
                    const iSD = el('startDate');
                    const iED = el('endDate');
                    
                    if (minDate && maxDate) {
                        const minDateString = minDate.toISOString().split('T')[0];
                        const maxDateString = maxDate.toISOString().split('T')[0];
                        
                        iSD.min = minDateString;
                        iSD.max = maxDateString;
                        iED.min = minDateString;
                        iED.max = maxDateString;
                    }
                }
                
                // Validate date selection
                function validateDates() {
                    const iSD = el('startDate');
                    const iED = el('endDate');
                    const erSD = el('erSD');
                    const erED = el('erED');
                    const applyFilterBtn = el('applyFilterBtn');
                    
                    let hasError = false;
                    
                    // Clear previous errors
                    erSD.style.display = 'none';
                    erED.style.display = 'none';
                    erSD.textContent = '';
                    erED.textContent = '';
                    
                    const startDate = iSD.value;
                    const endDate = iED.value;
                    
                    if (startDate && endDate) {
                        if (new Date(startDate) > new Date(endDate)) {
                            erED.textContent = 'End date must be after start date';
                            erED.style.display = 'block';
                            hasError = true;
                        }
                    }
                    
                    if (startDate && startDate.split('T')[0] < minDate.toISOString().split('T')[0]) {
                        erSD.textContent = 'No data available for this date';
                        erSD.style.display = 'block';
                        hasError = true;
                    }
                    
                    if (endDate && endDate.split('T')[0] > maxDate.toISOString().split('T')[0]) {
                        erED.textContent = 'No data available for this date';
                        erED.style.display = 'block';
                        hasError = true;
                    }
                    
                    // Disable apply button if there are errors
                    applyFilterBtn.disabled = hasError;
                }

                function refreshLogs() {
                  const loadingIndicator = el('loading-indicator');
                  const logContent = document.querySelector('.log-content');
                  
                  // Show loading indicator
                  loadingIndicator.style.display = 'block';
                  logContent.innerHTML = '';
                  
                  // Reset global variables
                  allLogRecords = [];
                  filteredRecords = [];
                  displayedRecords = [];
                  currentPage = 1;
                  
                  // Hide pagination during refresh
                  const pagination = el('paginationContainer');
                  const bottomPagination = el('bottomPaginationContainer');
                  if (pagination) pagination.style.display = 'none';
                  if (bottomPagination) bottomPagination.style.display = 'none';
                  
                  // Reload logs
                  getAllOperationLogs()
                    .then(records => {
                      console.log('Refreshed logs:', records);
                      if (records && records.length > 0) {
                        // populateLogs is now called from displayCurrentPage()
                        console.log('Logs refreshed successfully');
                      } else {
                        // Fallback to legacy single file approach
                        console.log('No multi-file logs found, trying legacy approach...');
                        return getRecordsFromBinaryFile('/logs/gen2-log.bin', '/logs/pointers.bin');
                      }
                    })
                    .then(records => {
                      if (records) {
                        console.log('Legacy logs:', records);
                        // Store legacy records and initialize filtering
                        allLogRecords = [...records];
                        filteredRecords = [...records];
                        updateFilterDisplay();
                        displayCurrentPage();
                      }
                    })
                    .catch(error => {
                      console.error('Error refreshing logs:', error);
                      logContent.innerHTML = '<p style="color: rgb(210, 30, 30); text-align: center;">Error loading logs</p>';
                    })
                    .finally(() => {
                      // Hide loading indicator
                      loadingIndicator.style.display = 'none';
                    });
                }
                
                // Global variables for pagination and filtering (if not already defined in logparsing.js)
                if (typeof allLogRecords === 'undefined') {
                    window.allLogRecords = [];
                    window.currentPage = 1;
                    window.logsPerPage = 100;
                    window.filteredRecords = [];
                    window.displayedRecords = [];
                }
                
                // Toggle filter expansion
                function toggleFilter() {
                    const filterContainer = el('dateFilterContainer');
                    const filterToggle = el('filterToggle');
                    
                    if (filterContainer.classList.contains('expanded')) {
                        filterContainer.classList.remove('expanded');
                        filterToggle.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>';
                    } else {
                        filterContainer.classList.add('expanded');
                        filterToggle.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
                    }
                }
                
                // Filter logs by date range
                function filterLogsByDate(startDate, endDate) {
                    if (!startDate && !endDate) {
                        filteredRecords = [...allLogRecords];
                    } else {
                       // Get local timezone offset in minutes
                        const timezoneOffset = new Date().getTimezoneOffset();
                        
                        filteredRecords = allLogRecords.filter(log => {
                            const logDate = log.date;
                            let includeLog = true;
                            
                            if (startDate) {
                                const start = new Date(startDate + "T00:00:00");
                                start.setHours(0, 0, 0, 0);
                                // Adjust for timezone offset to compare with UTC log dates
                                const startUTC = new Date(start.getTime() - (timezoneOffset * 60 * 1000));
                                if (logDate < startUTC) {
                                    includeLog = false;
                                }
                               
                            }
                            
                            if (endDate && includeLog) {
                                const end = new Date(endDate + "T23:59:59.999");
                                end.setHours(23, 59, 59, 999);
                                // Adjust for timezone offset to compare with UTC log dates
                                const endUTC = new Date(end.getTime() - (timezoneOffset * 60 * 1000));
                                if (logDate > endUTC) {
                                    includeLog = false;
                                }
                            }
                            
                            return includeLog;
                        });
                    }
                    
                    // Reset to first page
                    currentPage = 1;
                    
                    // Update UI
                    updateFilterDisplay();
                    displayCurrentPage();
                }
                
                // Update filter display
                function updateFilterDisplay() {
                    const filterDateRange = el('filterDateRange');
                    const filterCount = el('filterCount');
                    
                    if (filterCount) {
                        filterCount.textContent = `Total logs: ${filteredRecords.length}`;
                    }
                    
                    if (filterDateRange) {
                        const startDate = el('startDate').value;
                        const endDate = el('endDate').value;
                        
                         
                        if (startDate && endDate) {
                            filterDateRange.textContent = startDate + ' to ' + endDate;
                        } else if (startDate) {
                            filterDateRange.textContent = 'From ' + startDate;
                        } else if (endDate) {
                            filterDateRange.textContent = 'Until ' + endDate;
                        } else {
                            filterDateRange.textContent = 'All logs';
                        }
                    }
                }
                
                // Display current page of logs
                function displayCurrentPage() {
                    if (!filteredRecords || filteredRecords.length === 0) {
                        const logContentDiv = _qs(".log-content");
                        if (logContentDiv) {
                            logContentDiv.innerHTML = '<p style="text-align: center; color: #6c757d; padding: 20px;">No logs found for the selected date range.</p>';
                        }
                        const pagination = el('paginationContainer');
                        const bottomPagination = el('bottomPaginationContainer');
                        if (pagination) pagination.style.display = 'none';
                        if (bottomPagination) bottomPagination.style.display = 'none';
                        return;
                    }
                    
                    const totalPages = Math.max(1, Math.ceil(filteredRecords.length / logsPerPage));
                    if (currentPage > totalPages) currentPage = totalPages;
                    if (currentPage < 1) currentPage = 1;
                    
                    const startIndex = (currentPage - 1) * logsPerPage;
                    const endIndex = startIndex + logsPerPage;
                    displayedRecords = filteredRecords.slice(startIndex, endIndex);
                    
                    populateLogs(displayedRecords);
                    updatePagination();
                }
                
                // Pagination helpers
                function updatePagination() {
                    // Update top pagination
                    const pagination = el('paginationContainer');
                    const prevBtn = el('prevPageBtn');
                    const nextBtn = el('nextPageBtn');
                    const pageInfo = el('pageInfo');

                    // Update bottom pagination
                    const bottomPagination = el('bottomPaginationContainer');
                    const bottomPrevBtn = el('bottomPrevPageBtn');
                    const bottomNextBtn = el('bottomNextPageBtn');
                    const bottomPageInfo = el('bottomPageInfo');

                    const totalPages = Math.max(1, Math.ceil(filteredRecords.length / logsPerPage));

                    // Update top pagination
                    if (pagination && prevBtn && nextBtn && pageInfo) {
                        pageInfo.textContent = 'Page ' + currentPage + ' of ' + totalPages;
                        prevBtn.disabled = currentPage <= 1;
                        nextBtn.disabled = currentPage >= totalPages;
                        pagination.style.display = totalPages > 1 ? 'flex' : 'none';
                    }

                    // Update bottom pagination
                    if (bottomPagination && bottomPrevBtn && bottomNextBtn && bottomPageInfo) {
                        bottomPageInfo.textContent = 'Page ' + currentPage + ' of ' + totalPages;
                        bottomPrevBtn.disabled = currentPage <= 1;
                        bottomNextBtn.disabled = currentPage >= totalPages;
                        bottomPagination.style.display = totalPages > 1 ? 'flex' : 'none';
                    }
                }
                
                function goToPreviousPage() {
                    if (currentPage > 1) {
                        currentPage -= 1;
                        displayCurrentPage();
                    }
                }
                
                function goToNextPage() {
                    const totalPages = Math.max(1, Math.ceil(filteredRecords.length / logsPerPage));
                    if (currentPage < totalPages) {
                        currentPage += 1;
                        displayCurrentPage();
                    }
                }
                
                // Removed load more updater (replaced by updatePagination)

                
                // Apply date filter
                function applyDateFilter() {
                    const startDate = el('startDate').value;
                    const endDate = el('endDate').value;
                    const newLogsPerPage = parseInt(el('logLimit').value);
                    
                    // Update logs per page if changed
                    if (newLogsPerPage !== logsPerPage) {
                        logsPerPage = newLogsPerPage;
                    }
                    
                    filterLogsByDate(startDate, endDate);
                    toggleFilter();
                }
                
                // Clear date filter
                function clearDateFilter() {
                    el('startDate').value = '';
                    el('endDate').value = '';
                    filterLogsByDate('', ''); // Apply filter to show all logs
                }
                
                // Function to populate logs in the table
                function populateLogs(data) {
                    if (data) {
                        const logContentDiv = _qs(".log-content");
                        if (!logContentDiv) return;

                        const table = _ce("table");
                        data.forEach((log, index) => {
                            const row = _ce("tr");
                            const timestampCell = _ce("td");
                            const messageCell = _ce("td");

                            timestampCell.style.width = '145px';
                            timestampCell.style.whiteSpace = 'nowrap';

                            // Format timestamp to desired format
                            let offset = new Date().getTimezoneOffset();
                            const timestamp = new Date(log.date.getTime() + (offset * 60 * 1000));

                            const datePart = timestamp.getDate() + '/' + timestamp.toLocaleString('default', { month: 'short' });
                            const timePart = (timestamp.getHours() % 12 || 12) + ':' + String(timestamp.getMinutes()).padStart(2, '0') + ':' + String(timestamp.getSeconds()).padStart(2, '0') + (timestamp.getHours() >= 12 ? 'pm' : 'am');

                            timestampCell.innerHTML = '<span style="color:#888">' + datePart + '</span> <span style="color:#666;font-weight:500">' + timePart + '</span>';

                                        // Determine message based on mode
                            let message = modeMessages[log.md]; 

                            // Add duration for start events (excluding resume events and reject events)
                            if (log.duration && log.duration > 0) {
                                const isStartEvent = log.md == MoA.START_WEB || 
                                                   log.md == MoA.START_SCHEDULED || 
                                                   log.md == MoA.START_MANUAL_1 || 
                                                   log.md == MoA.START_MANUAL_2 || 
                                                   log.md == MoA.START_MANUAL_3 || 
                                                   log.md == MoA.START_MANUAL_4 || 
                                                   log.md == MoA.START_MQTT || 
                                                   log.md == MoA.START_CYCLIC;
                                
                                if (isStartEvent) {
                                    const hours = Math.floor(log.duration / 60);
                                    const minutes = log.duration % 60;
                                    let durationText = "";
                                    if (hours > 0 && minutes > 0) {
                                        durationText = 'Duration - ' + hours + ' H ' + minutes + ' M';
                                    } else if (hours > 0) {
                                        durationText = 'Duration - ' + hours + ' H';
                                    } else {
                                        durationText = 'Duration - ' + minutes + ' M';
                                    }
                                    message += ' <br /> - ' + durationText;
                                }
                            }
                            
                            if (log.current || log.voltage) {
                                let curStyle="";
                                let volStyle="";
                                if (log.md==MoA.STOP_OVERRUN || log.md==MoA.STOP_DRYRUN) {
                                    curStyle="color: rgb(210, 30, 30)";
                                } else if (log.md==MoA.STOP_LOWVOLTAGE || log.md==MoA.STOP_HIGHVOLTAGE) {
                                    volStyle="color: rgb(210, 30, 30)";
                                }
                                message += ' <br /> - Current: <span style="' + curStyle + '">' + log.current + '</span>, Voltage: <span style="' + volStyle + '">' + log.voltage + '</span>';
                            }
                            messageCell.innerHTML = message;

                            // Append cells to row, and row to table
                            row.appendChild(timestampCell);
                            row.appendChild(messageCell);
                            table.appendChild(row);
                        });
                        // Clear existing content and append the new table
                        logContentDiv.innerHTML = "";
                        logContentDiv.appendChild(table);
                    }
                    
                }
        </script>
        <!-- <div id="stale-message" style="display:none ;">
          The connection to the switch is lost. Please refresh the page.
        </div> -->
      </div>
    </div>
  </body>
</html>
