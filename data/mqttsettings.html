  <div class="main-container">
      <div class="main-container">
    <header class="nav-bar" >
      <div>
        <a href="/" style="float:left;">

            <img src="images/wifi_g.svg" id="wifi-g" title="Wifi Good" alt="Wifi Good" style="display: none;" />

      <main id="content">
       

        

        <div class="power-settings-container padding-outer-2 " >
          <div class="power-settings gap-flex">
            
            <h4 class="main-heading">Cloud Server Settings</h4>
            <div class="pcard pd2">
              <div class="hc pr">
                <h4 class="sh">Sync control</h4>
                <button type="button" class="help-i" data-help="mqtt.sync" aria-label="Help"></button></div>
              <div class="pid cn ff" style="margin: 10px 0px">
                <p class="power-content">Do you want to Send data to cloud?</p>
                <br />
                <div>
                  <input type="radio" class="cloud-sync" name="cloud-sync" value="1" />

                </div>
                <div>
                  <input type="radio" class="cloud-sync" name="cloud-sync" value="0" checked/>
                  <label>No</label>
                </div>
                
              </div>
            </div>
            
            <div class="wifi-settings i-c-c gap-flex cn pd2">
              <div class="hc pr">
                <h4 class="sh">MQTT settings</h4>
                <button type="button" class="help-i" data-help="mqtt.access" aria-label="Help"></button></div>
             
              <div class="deviceName">
                <span title="Access token">Access token </span>
                <input type="text" id="mqttToken" class="idB cn" name="mqttToken"  required />
              </div>
              <!-- <div class="deviceName">
                <span title="Device Id">Device Id </span>
                <input type="text" id="mqttDeviceId" class="input-div cn" name="mqttDeviceId"  required />
              </div> -->
              <div>
                <input type="button" id="submitMQTTAccess" class="cn button" value="Save" onclick="saveMQTTSettings()"/>

                    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3); 
                    color: white; 
                    width: 250px; 

                    
                  ">
          <span id="popupText">asdfsadf</span>
        </div>
      </main>
    </div>
  </div>
  <script>

    document.addEventListener("DOMContentLoaded", () => {
      fetchWT("/dn.htm").then((response) => {
                // Get the custom header value
                const v = response.headers.get("switchName");
                if (v) {
                  // Set the custom header value to the div
                  var e = _qs("#switchNameText");
                  if (e) {
                    e.innerText = v;
                  }
                }
              });
      const radioElement = document.getElementsByName("cloud-sync");
      for (const radio of radioElement) {
        radio.addEventListener("click", (event) => {
          if (event.target.value === "1") {
            el("mqttToken").disabled = false;
            // el("mqttDeviceId").disabled = false;
          } else {
            el("mqttToken").disabled = true;
            // el("mqttDeviceId").disabled = true;
          }
        });
      }

      showCloudSyncDetails();
    });
    
    function showCloudSyncDetails() {

      fetchWT('/api/getCloudSyncSettings')
          .then(response => {
              if (!response.ok) {
                  throw new Error('There is a problem with cloud sync details fetch operation: ' + response.statusText);
              }
              return response.json();
          })
          .then(function (result) {
            console.log(result);
            _qs(`.cloud-sync[value="${result.syncEnabled}"]`
              ).checked = true;
            if (result.syncEnabled === "1") {
                el("mqttToken").disabled = false;
                // el("mqttDeviceId").disabled = false;
              } else {
                el("mqttToken").disabled = true;
                // el("mqttDeviceId").disabled = true;
              } 
          })
          .catch(error => {
              console.error( error);
          });
    }
    function saveMQTTSettings() {

      let selectedRadio = _qs(`.cloud-sync:checked`);
      var syncEnabled = selectedRadio ? (selectedRadio.value=="1"? true:false ): false;
      var data;
      if (syncEnabled){
        var tokenObj = el("mqttToken");
        // var deviceIdObj = el("mqttDeviceId");
        var token=tokenObj.value.trim()
        // var deviceId = deviceIdObj.value.trim();
        var deviceId = "sample-device";
        if (token.length < 10 || deviceId.length < 10) {
          alert("Please enter valid access token and device id");
          tokenObj.focus();
          return false;
        }
        data = JSON.stringify({syncEnabled:"1", mqttToken: token, deviceId: deviceId});
      } else {
        data = JSON.stringify({ syncEnabled: "0"});
      }
      

      fetchWT("/api/setCloudSync", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: data,
        })
        .then((response) => {
          if (!response.ok) {
            return response.text().then((errorMessage) => {
              throw new Error(errorMessage);
            });
          }
          return response.text();
        })
        .then((result) => {
          displaySuccess(result);
        })
        .catch((error) => {
        console.error(error.message);
        displayFailure("Error saving MQTT settings... Please try again.");
      });
    }

  </script>
</body>
