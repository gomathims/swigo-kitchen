; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:envS3C1]
board = esp32-s3-devkitc-1
platform = espressif32
framework = arduino
lib_deps = 
	arduino-libraries/NTPClient@^3.2.1
	adafruit/RTClib@^2.1.4
	esp_littlefs
	marian-craciunescu/ESP32Ping@^1.7
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.3.1
	; me-no-dev/ESPAsyncWebServer@^3.6.0
	; khoih-prog/WebServer_ESP32_SC_W5500@^1.2.1
	khoih-prog/WebServer_ESP32_SC_W5500@^1.2.1
	me-no-dev/ESPAsyncWebServer@^3.6.0
	h2zero/NimBLE-Arduino@^1.4.2

monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbserial-1110
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
extra_scripts = 
	pre:migrateWebfilestoStrings.py
build_flags = 
	-D FIRMWARE_MAJOR=1
	-D FIRMWARE_MINOR=21
	-D FIRMWARE_PATCH=1

	; -D READING_FROM_SHUNT_OR_CT=\"S\"
	; ; -D LED_RGB=1
	; -D LED_RGB_FLOATRELAY=1
	; -D LED_NORMAL=1
	-D SPECIAL_PASSWORD=0
	-D PROD_BETA=\"P\"
	-D THINGSBOARD_SERVER_URL=\"https:\/\/iot.eviqtech.com\" ;
	-D THINGSBOARD_REGISTER_URI=\"/api/device/registerDevice\" ;
	-D THINGSBOARD_MQTT=\"iot.eviqtech.com\" 
	; -D THINGSBOARD_SERVER_URL=\"http:\/\/192.168.0.134:8080\" ;
	; -D THINGSBOARD_REGISTER_URI=\"/api/device/registerDevice\" ;
	; -D THINGSBOARD_MQTT=\"192.168.0.134\"
;  Long debounce delay condition
	-D SPECIAL_DEBOUNCE_DELAY=1

	-D CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=1
	-D CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF=1
	
	; BLE/WiFi Coexistence settings (NO PSRAM)
	-D CONFIG_BT_ENABLED=1
	-D CONFIG_NIMBLE_ENABLED=1
	-D CONFIG_BT_NIMBLE_ENABLED=1
	-D CONFIG_BTDM_CTRL_MODE_BLE_ONLY=1
	-D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
	-D CONFIG_BT_NIMBLE_TASK_STACK_SIZE=4096
	-D CONFIG_NIMBLE_CPP_LOG_LEVEL=2
	-D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
	-D CONFIG_BT_NIMBLE_PINNED_TO_CORE=0
	-D CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=4096

	; -D LOG_TIMING=1 

    ; -DHTTP_PARSER_STRICT=0
    ; -DASYNC_TCP_SSL_ENABLED=0
    ; -DCORE_DEBUG_LEVEL=5
